[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esm2-mech"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # LLM APIs
    "anthropic",
    # Viz
    "matplotlib",
    # Common
    "torch",
    "numpy",
    "pandas",
    "requests",
    "openpyxl",
    "fair-esm",
    "scikit-learn>=1.7",
    "scipy",
    "xgboost",
    "biopython",
]

[project.optional-dependencies]
# GPU-only, needs --extra-index-url=https://pypi.nvidia.com and a CUDA 12 host.
# pip install --extra-index-url=https://pypi.nvidia.com -e ".[gpu]"
# cuml-cu12==25.8.0 is incompatible with scikit-learn>=1.9 (cuml.accel imports
# BaseEstimator._get_default_requests, removed in 1.9). Pin scikit-learn<1.9
# alongside this extra, or wait for a cuml release that supports 1.9.
gpu = ["cuml-cu12==25.8.*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." puts the repo root on the path so tests can import scripts/ (compare_runs),
# which is a CLI entry point rather than part of the installed package.
pythonpath = ["src", "."]

testpaths = ["tests"]

markers = [
    "slow: fits real probes (logreg/MLP); deselect with -m 'not slow'",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest",
]
