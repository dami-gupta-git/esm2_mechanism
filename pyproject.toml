[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esm2-mech"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # LLM APIs
    "anthropic",
    # Viz
    "matplotlib",
    # Common
    "torch",
    "numpy",
    "pandas",
    "requests",
    "openpyxl",
    "fair-esm",
    "scikit-learn>=1.7",
    "scipy",
    "xgboost",
    "biopython",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." puts the repo root on the path so tests can import scripts/ (compare_runs),
# which is a CLI entry point rather than part of the installed package.
pythonpath = ["src", "."]

testpaths = ["tests"]

markers = [
    "slow: fits real probes (logreg/MLP); deselect with -m 'not slow'",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest",
]
