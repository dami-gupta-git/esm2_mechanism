[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esm2-mech"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # LLM APIs
    "anthropic",
    "aider-chat",
    "backoff",
    "openai",
    "google-generativeai",
    # Viz
    "matplotlib",
    "pypdf",
    "pymupdf4llm",
    # Common
    "torch",
    "numpy",
    "pandas",
    "requests",
    "openpyxl",
    "transformers",
    "datasets",
    "tiktoken",
    "wandb",
    "tqdm",
    "fair-esm",
    "scikit-learn",
    "scipy",
    "xgboost",
    "biopython",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]

markers = [
    "slow: fits real probes (logreg/MLP); deselect with -m 'not slow'",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest",
]
