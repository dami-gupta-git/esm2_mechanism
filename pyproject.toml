[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esm2-mechanism"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # LLM APIs
    "anthropic",
    "aider-chat",
    "backoff",
    "openai",
    "google-generativeai",
    # Viz
    "matplotlib",
    "pypdf",
    "pymupdf4llm",
    # Common
    "torch",
    "numpy",
    "transformers",
    "datasets",
    "tiktoken",
    "wandb",
    "tqdm",
    "fair-esm",
    "scikit-learn",
    "scipy",
    # Evo2 (requires CUDA; install flash-attn with: pip install flash-attn --no-build-isolation)
    "evo2",
    "xgboost",
    "biopython",
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
